<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuperProxy 超级代理</title><style>
*{box-sizing:border-box}body{font:14px system-ui,-apple-system;margin:0;background:#f4f6f9;color:#182230}.wrap{max-width:1280px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand h1{margin:0;font-size:25px}.muted{color:#667085}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #1018280a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{padding:14px;border:1px solid #eaecf0;border-radius:10px}.stat b{display:block;font-size:22px;margin-top:5px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,input,select,textarea{padding:9px 11px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}button{cursor:pointer}button.primary{background:#101828;color:#fff;border-color:#101828}button.danger{color:#b42318}input,select{min-width:150px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}.wide{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eaecf0}pre{white-space:pre-wrap;max-height:260px;overflow:auto;background:#101828;color:#d0d5dd;padding:12px;border-radius:9px}.ok{color:#067647}.bad{color:#b42318}.pill{padding:3px 8px;border-radius:99px;background:#f2f4f7}.hidden{display:none}.ipbox{min-height:90px;width:100%;font-family:monospace}</style></head><body><div class="wrap">
<div class="top"><div class="brand"><h1>SuperProxy · 超级代理</h1><div class="muted">固定 IP → 指定节点 · IPv4 Only · Fail-Closed</div></div><div><input id="token" type="password" placeholder="API Token"><button onclick="saveToken()">登录</button></div></div>
<div class="card"><div class="grid"><div class="stat">Core 状态<b id="coreState">检测中</b></div><div class="stat">节点<b id="nodeCount">-</b></div><div class="stat">绑定组<b id="bindCount">-</b></div><div class="stat">架构<b id="arch">浏览器无关</b></div></div><div class="row" style="margin-top:14px"><button id="installCore" class="primary hidden" onclick="installCoreNow()">安装 sing-box 内核</button><button onclick="svc('start')">启动内核</button><button onclick="svc('stop')">停止内核</button><button onclick="svc('restart')">重启内核</button><button class="primary" onclick="apply()">生成并应用</button><button onclick="loadAll()">刷新</button></div><div id="coreInfo" class="muted" style="margin-top:9px"></div></div>
<div class="card"><h3>添加代理节点</h3><div class="form"><input id="nName" placeholder="节点名称，如 US-ISP-001"><select id="nType" onchange="nodeFields()"><option value="socks">SOCKS5</option><option value="http">HTTP</option><option value="vless">VLESS</option><option value="trojan">Trojan</option><option value="shadowsocks">Shadowsocks</option></select><input id="nServer" placeholder="服务器/IP"><input id="nPort" type="number" placeholder="端口"><input id="nUser" placeholder="用户名（可选）"><input id="nPass" type="password" placeholder="密码 / Trojan 密码"><input id="nUUID" class="hidden" placeholder="UUID"><input id="nMethod" class="hidden" placeholder="加密方式，如 2022-blake3-aes-128-gcm"><label><input id="nTLS" type="checkbox"> TLS</label><input id="nSNI" placeholder="SNI（可选）"></div><div class="row"><button class="primary" onclick="addNode()">添加节点</button></div></div>
<div class="card"><h3>节点与手机 IP 绑定</h3><div class="row"><select id="bindNode"></select></div><p class="muted">每行一个固定 IPv4；也支持范围，例如 192.168.20.101-192.168.20.110。一个 IP 同时只能属于一个节点。</p><textarea id="bindIPs" class="ipbox" placeholder="192.168.20.101&#10;192.168.20.102"></textarea><div class="row"><button class="primary" onclick="saveBinding()">保存该节点绑定</button></div></div>
<div class="card"><h3>节点列表</h3><div style="overflow:auto"><table><thead><tr><th>名称</th><th>协议</th><th>服务器</th><th>绑定 IP</th><th>操作</th></tr></thead><tbody id="nodeRows"></tbody></table></div></div>
<div class="card"><details><summary><b>高级配置</b></summary><textarea id="cfg" style="width:100%;min-height:300px;margin-top:12px;font-family:monospace"></textarea><div class="row"><button onclick="saveCfg()">保存高级配置</button></div></details></div>
<div class="card"><h3>日志</h3><pre id="logs">-</pre></div></div><script>
let tok=localStorage.superproxyToken||'', C=null;token.value=tok;function H(){return {'Authorization':'Bearer '+tok}}function saveToken(){tok=token.value;localStorage.superproxyToken=tok;loadAll()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadAll(){let s=await fetch('/api/status',{headers:H()});if(!s.ok){coreState.innerHTML='<span class=bad>认证失败</span>';return}let st=await s.json();coreState.innerHTML=st.core_installed?'<span class=ok>已安装</span>':'<span class=bad>未安装</span>';installCore.classList.toggle('hidden',st.core_installed);coreInfo.textContent=st.core_version||'设备未安装 sing-box，可直接点击“安装 sing-box 内核”。';nodeCount.textContent=st.nodes;bindCount.textContent=st.bindings;let c=await fetch('/api/config',{headers:H()});if(c.ok){C=await c.json();cfg.value=JSON.stringify(C,null,2);render()}let l=await fetch('/api/logs',{headers:H()});if(l.ok)logs.textContent=await l.text()}
function nodeFields(){nUUID.classList.toggle('hidden',nType.value!=='vless');nMethod.classList.toggle('hidden',nType.value!=='shadowsocks')}
function render(){let opts='<option value="">选择节点</option>',rows='';for(let n of C.nodes){let b=C.bindings.find(x=>x.node_id===n.id),cnt=b?b.ips.length:0;opts+=`<option value="${esc(n.id)}">${esc(n.name)} (${cnt} IP)</option>`;rows+=`<tr><td>${esc(n.name)}</td><td><span class=pill>${esc(n.type)}</span></td><td>${esc(n.server)}:${n.port}</td><td>${cnt}</td><td><button onclick="editBind('${esc(n.id)}')">绑定</button> <button class=danger onclick="delNode('${esc(n.id)}')">删除</button></td></tr>`}bindNode.innerHTML=opts;nodeRows.innerHTML=rows||'<tr><td colspan=5 class=muted>暂无节点</td></tr>'}
function id(){return 'n'+Date.now().toString(36)}function addNode(){let n={id:id(),name:nName.value.trim(),type:nType.value,server:nServer.value.trim(),port:+nPort.value,username:nUser.value.trim(),password:nPass.value,uuid:nUUID.value.trim(),method:nMethod.value.trim(),tls:nTLS.checked,server_name:nSNI.value.trim()};if(!n.name||!n.server||!n.port)return alert('请填写节点名称、服务器和端口');C.nodes.push(n);saveObject('节点已添加')}
function expandIPs(t){let out=[];for(let line of t.split(/[\n,\s]+/).filter(Boolean)){let m=line.match(/^(\d+\.\d+\.\d+\.)(\d+)-(?:\d+\.\d+\.\d+\.)?(\d+)$/);if(m){for(let i=+m[2];i<=+m[3];i++)out.push(m[1]+i)}else out.push(line)}return [...new Set(out)]}
function editBind(id){bindNode.value=id;let b=C.bindings.find(x=>x.node_id===id);bindIPs.value=b?b.ips.join('\n'):'';scrollTo({top:bindNode.closest('.card').offsetTop-10,behavior:'smooth'})}bindNode.onchange=()=>{let b=C?.bindings.find(x=>x.node_id===bindNode.value);bindIPs.value=b?b.ips.join('\n'):''}
function saveBinding(){let nid=bindNode.value;if(!nid)return alert('请选择节点');let ips=expandIPs(bindIPs.value);C.bindings=C.bindings.filter(x=>x.node_id!==nid);if(ips.length)C.bindings.push({node_id:nid,ips});saveObject('绑定已保存')}
function delNode(id){if(!confirm('删除节点及其绑定？'))return;C.nodes=C.nodes.filter(n=>n.id!==id);C.bindings=C.bindings.filter(b=>b.node_id!==id);saveObject('已删除')}
async function saveObject(msg){let r=await fetch('/api/config',{method:'PUT',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify(C)});let t=await r.text();if(!r.ok)return alert(t);alert(msg);loadAll()}
async function saveCfg(){try{C=JSON.parse(cfg.value)}catch(e){return alert('JSON错误: '+e)}saveObject('配置已保存')}
async function svc(a){let r=await fetch('/api/service/'+a,{headers:H()});alert(await r.text());loadAll()}async function apply(){if(!confirm('将验证配置、启用防直连规则并应用 sing-box，继续？'))return;let r=await fetch('/api/apply',{method:'POST',headers:H()});alert(await r.text());loadAll()}
async function installCoreNow(){if(!confirm('将从 sing-box 官方安装源安装/升级内核，继续？'))return;installCore.disabled=true;installCore.textContent='正在安装…';let r=await fetch('/api/core/install',{method:'POST',headers:H()});let x=await r.json().catch(()=>({output:'安装失败'}));alert(x.output);installCore.disabled=false;installCore.textContent='安装 sing-box 内核';loadAll()}
nodeFields();loadAll();</script></body></html>
